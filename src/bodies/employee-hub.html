<script>
/* ================= EMPLOYEE HUB SOFT GATE =================
   SET THIS to the real GHL slug of the login page. If it does not
   match a published page the gate disables itself and this page
   still renders, instead of dead-ending on GHL's "Not found".
   ========================================================== */
(function(){
  var EH_LOGIN_URL='/employee-hub-login/';
  try{
    if(!/(^|\.)insynconline\.net$/.test(location.hostname)){return;} /* enforce only on the live site */
    var d=JSON.parse(localStorage.getItem('insHubAuth')||'null');
    if(d&&d.t&&(Date.now()-d.t)<=30*24*60*60*1000){return;}            /* already unlocked */

    var st=document.createElement('style');                             /* hold the body block back while we confirm */
    st.id='ehGateHide';st.textContent='.ehap{visibility:hidden}';
    if(document.head){document.head.appendChild(st);}
    var done=false;
    function reveal(){
      if(done){return;}
      done=true;
      var n=document.getElementById('ehGateHide');
      if(n&&n.parentNode){n.parentNode.removeChild(n);}
    }
    setTimeout(reveal,1500);                                            /* watchdog: never leave the page blank */

    if(!window.fetch){location.replace(EH_LOGIN_URL);return;}
    fetch(EH_LOGIN_URL,{method:'HEAD'}).then(function(r){
      if(r&&r.ok){location.replace(EH_LOGIN_URL);}
      else{
        reveal();
        if(window.console){console.warn('[InSync Hub] No page at '+EH_LOGIN_URL+' — gate disabled. Publish the login page at that slug, or change EH_LOGIN_URL to match.');}
      }
    })['catch'](function(){reveal();});
  }catch(e){/* storage blocked: fail open to avoid a redirect loop */}
})();
</script>

<style>
/* ── Tokens live on the WRAPPER, never the root element (a body block shares the page) ── */
.ehap{
  --bg:#000;--bg-1:#0a0a0a;--bg-card:#0e0e0e;--bg-elev:#171717;
  --ink:#fff;--ink-2:rgba(255,255,255,.72);--ink-3:rgba(255,255,255,.5);
  --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.14);
  --orange:#ef5a28;--orange-2:#ff7a4d;--orange-3:#ff9060;
  --f:'Inter',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;
  --e:cubic-bezier(.4,0,.2,1);--e-out:cubic-bezier(.16,1,.3,1);
  --nav-h:64px;--gutter:24px;
}
@media(max-width:640px){.ehap{--gutter:16px}}
@media(max-width:400px){.ehap{--gutter:14px}}

.ehap,.ehap *,.ehap *::before,.ehap *::after{box-sizing:border-box;margin:0;padding:0}
.ehap{position:relative;isolation:isolate;overflow:clip;background:var(--bg);color:var(--ink);font-family:var(--f);line-height:1.6;-webkit-font-smoothing:antialiased}
.ehap a{text-decoration:none;color:inherit}
.ehap .eh-wrap{max-width:1240px;margin:0 auto;padding:0 var(--gutter)}

/* ── Cursor restore (the global Apex layer hides the native cursor site-wide) ── */
.ehap,.ehap *{cursor:auto !important}
.ehap a[href],.ehap button,.ehap [role="button"],.ehap label[for]{cursor:pointer !important}
.ehap input,.ehap textarea,.ehap select{cursor:text !important}

/* ── HERO VIDEO — Layer 1, scroll-scrubbed span (top-anchored, not zoomed) ── */
.eh-vid{position:fixed;inset:0;z-index:0;opacity:0;transition:opacity .5s ease;pointer-events:none;background:#000}
.eh-vid.is-on{opacity:1}
.eh-vid video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 0;filter:brightness(.62);opacity:0;transition:opacity 1.1s linear;will-change:opacity}
.eh-vid video.is-live{opacity:1}
.eh-vid__scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.5) 42%,rgba(0,0,0,.72) 100%)}
.eh-vid__shade{position:absolute;inset:0;background:rgba(0,0,0,.66);opacity:0}
@media(max-width:1024px),(pointer:coarse),(prefers-reduced-motion:reduce){.eh-vid{display:none !important}}
/* Only the spanned sections go transparent while the layer is live — never the whole page */
.ehap.vid-on .eh-hero,.ehap.vid-on .eh-tiles-sec{background:transparent !important}

/* ── HERO ── */
.ehap .eh-hero{position:relative;z-index:2;padding:calc(var(--nav-h) + 110px) 0 72px;text-align:center;background:var(--bg)}
.ehap .eh-hero::before{content:"";position:absolute;top:-10%;left:50%;transform:translateX(-50%);width:900px;height:600px;background:radial-gradient(ellipse at center,rgba(239,90,40,.08) 0%,transparent 60%);pointer-events:none;z-index:-1}
.ehap .eh-hero__inner{max-width:880px;margin:0 auto}
.ehap .eh-eyebrow{display:inline-flex;align-items:center;gap:10px;font:600 11.5px/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--orange)}
.ehap .eh-eyebrow::before{content:"";width:18px;height:1px;background:currentColor;flex:none}
.ehap .eh-hero__title{font-size:clamp(44px,7vw,96px);font-weight:800;letter-spacing:-.03em;line-height:1.02;padding-bottom:.16em;margin:22px 0 22px;color:var(--ink)}
.ehap .eh-hero__title .accent{color:var(--orange)}
.ehap .eh-hero__sub{font-size:17px;color:var(--ink-2);max-width:620px;margin:0 auto;line-height:1.7}

/* ── HUB TILES (glass over the video region; solid on mobile) ── */
.ehap .eh-tiles-sec{position:relative;z-index:2;padding:32px 0 140px;background:var(--bg)}
.ehap .eh-tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.ehap .eh-tile{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:34px;min-height:200px;background:rgba(255,255,255,.045);backdrop-filter:blur(8px) saturate(1.08);-webkit-backdrop-filter:blur(8px) saturate(1.08);border:1px solid var(--line-2);border-radius:20px;padding:26px 24px;transition:transform .4s var(--e-out),border-color .4s var(--e),box-shadow .4s var(--e)}
.ehap .eh-tile::before{content:"";position:absolute;top:0;right:0;width:70%;height:70%;background:radial-gradient(circle at 100% 0%,rgba(239,90,40,.12) 0%,transparent 60%);opacity:0;transition:opacity .4s var(--e);pointer-events:none}
.ehap .eh-tile:hover{transform:translateY(-4px);border-color:rgba(239,90,40,.4);box-shadow:0 24px 48px -16px rgba(0,0,0,.8),0 12px 28px -10px rgba(239,90,40,.2)}
.ehap .eh-tile:hover::before{opacity:1}
.ehap .eh-tile__ic{width:28px;height:28px;color:var(--ink-2);transition:color .4s var(--e)}
.ehap .eh-tile:hover .eh-tile__ic{color:var(--orange)}
.ehap .eh-tile__ic svg{width:28px;height:28px;display:block}
.ehap .eh-tile__foot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.ehap .eh-tile__label{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.35;color:var(--ink)}
.ehap .eh-tile__arrow{width:18px;height:18px;flex:none;color:var(--ink-3);transition:color .3s var(--e),transform .3s var(--e)}
.ehap .eh-tile:hover .eh-tile__arrow{color:var(--orange)}
.ehap .eh-tile:hover .eh-tile__arrow--in{transform:translateX(4px)}
.ehap .eh-tile:hover .eh-tile__arrow--ext{transform:translate(3px,-3px)}

/* ── Scroll-entrance reveal contract ── */
.ehap.js .rv{opacity:0;transform:translateY(20px);transition:opacity .8s var(--e-out),transform .8s var(--e-out)}
.ehap.js .rv.in{opacity:1;transform:none}
.ehap.js .d1{transition-delay:.12s}
.ehap.js .d2{transition-delay:.24s}

/* ── Responsive ── */
@media(max-width:1200px){
.ehap .eh-tiles{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:900px){
.ehap .eh-tile{background:var(--bg-card);backdrop-filter:none;-webkit-backdrop-filter:none}
}
@media(max-width:640px){
.ehap .eh-hero{padding:calc(var(--nav-h) + 72px) 0 48px}
.ehap .eh-hero__sub{font-size:15.5px}
.ehap .eh-tiles-sec{padding:16px 0 80px}
.ehap .eh-tiles{grid-template-columns:1fr}
.ehap .eh-tile{min-height:0;gap:26px;padding:22px 20px}
.ehap .eh-tile__foot{min-height:48px;align-items:center}
}
@media (prefers-reduced-motion:reduce){
.ehap.js .rv{opacity:1;transform:none;transition:none}
.ehap .eh-tile{transition:none}
}

<script>
(function(){
  'use strict';
  var page=document.getElementById('ehPage');
  if(!page){return;}

  /* ============================================================
     HERO BACKGROUND VIDEO — looping with a crossfade at every seam.
     Two stacked <video> elements share the same clip: the idle one
     starts and fades up while the playing one fades out, so the loop
     point is a soft dissolve instead of a visible jump.
     Change the clip by swapping the URL constant below.
     ============================================================ */
  var EH_HERO_VIDEO_URL='https://assets.cdn.filesafe.space/lAvsV54bgyIkgTbpk5QX/media/6a7f3059cf50f900f2fdf582.mp4';
  var EH_FADE=1.1;   /* crossfade length in seconds — also set in the CSS transition */

  var vidLayer=document.getElementById('ehVid'),
      shade=document.getElementById('ehVidShade'),
      hero=document.getElementById('ehHero');

  function motionOff(){
    return !EH_HERO_VIDEO_URL
      || window.innerWidth<=1024
      || (window.matchMedia&&(matchMedia('(pointer:coarse)').matches||matchMedia('(prefers-reduced-motion:reduce)').matches));
  }

  if(vidLayer&&hero&&!motionOff()){
    /* A transformed/filtered ancestor breaks position:fixed — re-parent to body if one is found. */
    (function(){
      var n=vidLayer.parentElement,broken=false;
      while(n&&n!==document.body){
        var s=getComputedStyle(n);
        if((s.transform&&s.transform!=='none')||(s.filter&&s.filter!=='none')||(s.perspective&&s.perspective!=='none')||s.contain==='paint'||(s.getPropertyValue('will-change')||'').indexOf('transform')>-1){broken=true;break;}
        n=n.parentElement;
      }
      if(broken){document.body.appendChild(vidLayer);}
    })();

    var dead=false,armed=false,swapping=false;

    function mkVideo(){
      var v=document.createElement('video');
      v.muted=true;v.defaultMuted=true;v.playsInline=true;
      v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');
      v.preload='auto';v.loop=false;
      v.addEventListener('error',kill);            /* decode guard */
      v.src=EH_HERO_VIDEO_URL;                     /* URL from a JS constant, never a src attribute */
      vidLayer.insertBefore(v,vidLayer.firstChild);
      return v;
    }
    function kill(){
      dead=true;
      vidLayer.classList.remove('is-on');
      vidLayer.style.display='none';
      page.classList.remove('vid-on');
    }

    var vA=mkVideo(),vB=mkVideo(),playing=vA,idle=vB;
    vA.classList.add('is-live');

    function arm(){                                 /* listeners are attached before src, so a cached load cannot outrun them */
      if(armed||dead||!isFinite(playing.duration)||!(playing.duration>0)){return;}
      armed=true;
      vidLayer.classList.add('is-on');
      page.classList.add('vid-on');
      try{var pr=playing.play();if(pr&&pr['catch']){pr['catch'](function(){});}}catch(e){}
      requestAnimationFrame(loopWatch);
    }
    vA.addEventListener('loadedmetadata',arm);
    vA.addEventListener('durationchange',arm);
    vA.addEventListener('canplay',arm);
    if(vA.readyState>=1){arm();}

    function loopWatch(){
      if(dead){return;}
      var d=playing.duration;
      if(!swapping&&isFinite(d)&&d>0&&playing.currentTime>=d-EH_FADE){
        swapping=true;
        var out=playing,inn=idle;
        try{inn.currentTime=0;var p2=inn.play();if(p2&&p2['catch']){p2['catch'](function(){});}}catch(e2){}
        inn.classList.add('is-live');               /* fades up */
        out.classList.remove('is-live');            /* fades out over the same beat */
        playing=inn;idle=out;
        setTimeout(function(){                       /* park the retired element once it is invisible */
          try{out.pause();out.currentTime=0;}catch(e3){}
          swapping=false;
        },EH_FADE*1000+80);
      }
      requestAnimationFrame(loopWatch);
    }

    /* Shade deepens as the hero scrolls away (no-op on a page with no scroll runway) */
    function shadeFrame(){
      if(dead||!shade){return;}
      var r=hero.getBoundingClientRect(),bottom=r.bottom+window.pageYOffset;
      var ramp=window.innerHeight*0.45,start=bottom-ramp,y=window.pageYOffset;
      var o=ramp>0?Math.max(0,Math.min((y-start)/ramp,1)):0;
      shade.style.opacity=o.toFixed(3);
    }
    window.addEventListener('scroll',shadeFrame,{passive:true});
    window.addEventListener('resize',shadeFrame);
    shadeFrame();
  }else if(vidLayer){
    vidLayer.style.display='none';
  }

  /* ── Reveal contract: threshold 0 + bottom rootMargin, on-screen-only safety ── */
  var revs=[].slice.call(page.querySelectorAll('.rv'));
  var io=('IntersectionObserver' in window)?new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target);}});
  },{threshold:0,rootMargin:'0px 0px -12% 0px'}):null;
  if(io){revs.forEach(function(el){io.observe(el);});}else{revs.forEach(function(el){el.classList.add('in');});}

  /* JS sibling stagger — 70ms apart, capped at 350ms; skips authored d1/d2 delays */
  [].slice.call(page.querySelectorAll('.eh-tiles,.eh-hero__inner')).forEach(function(par){
    var kids=[].slice.call(par.children).filter(function(c){
      return c.classList.contains('rv')&&!/\bd[1-3]\b/.test(c.className);
    });
    kids.forEach(function(c,i){c.style.transitionDelay=Math.min(i*0.07,0.35).toFixed(2)+'s';});
  });

  requestAnimationFrame(function(){
    revs.forEach(function(el){if(el.getBoundingClientRect().top<window.innerHeight*0.92){el.classList.add('in');}});
  });
  setTimeout(function(){                                   /* safety — ON-SCREEN ONLY */
    revs.forEach(function(el){if(el.getBoundingClientRect().top<window.innerHeight){el.classList.add('in');}});
  },2500);
})();
</script>
